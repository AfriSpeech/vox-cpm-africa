[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vox-cpm-africa"
version = "0.1.0"
description = "VoxCPM 0.5B adapted for African languages with Africa-G2P and voice cloning"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "AfriSpeech"}]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "zero-shot",
    "voice-cloning",
    "african-languages",
    "voxcpm"
]

dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.46.2",
    "accelerate",
    "datasets",
    "soundfile",
    "soxr",
    "phonemizer",
    "argbind",
    "tensorboardX",
    "safetensors",
    "librosa",
    "pyyaml",
]

[project.optional-dependencies]
africa = [
    "africa-g2p",
]

[project.scripts]
vox-cpm-africa-infer = "voxcpm_africa.infer:main"
vox-cpm-africa-train = "voxcpm_africa.train:main"

[tool.hatch.build.targets.sdist]
include = ["voxcpm_africa"]

[tool.hatch.build.targets.wheel]
packages = ["voxcpm_africa"]
